<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Text Adventure Mystery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game">
    <header>
      <h1>Text Adventure Mystery</h1>
      <p id="room-name"></p>
    </header>
    <aside id="notebook" class="panel" hidden>
      <h2>Notebook — places visited</h2>
      <ul id="notebook-visited"></ul>
    </aside>
    <aside id="items" class="panel" hidden>
      <h2>Items</h2>
      <ul id="items-inventory"></ul>
    </aside>
    <div id="log"></div>
    <form id="input-row">
      <input id="input" type="text" autocomplete="off" placeholder="What do you do?" />
      <button type="submit">Go</button>
    </form>
  </main>
  <script src="game.js"></script>
</body>
</html>
