<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Text Adventure Mystery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game">
    <header>
      <h1>Text Adventure Mystery</h1>
      <p id="room-name"></p>
      <button id="notebook-toggle" type="button">Notebook</button>
    </header>
    <aside id="notebook" hidden>
      <section>
        <h2>Places visited</h2>
        <ul id="notebook-visited"></ul>
      </section>
      <section>
        <h2>Items collected</h2>
        <ul id="notebook-inventory"></ul>
      </section>
    </aside>
    <div id="log"></div>
    <form id="input-row">
      <input id="input" type="text" autocomplete="off" placeholder="What do you do?" />
      <button type="submit">Go</button>
    </form>
  </main>
  <script src="game.js"></script>
</body>
</html>
